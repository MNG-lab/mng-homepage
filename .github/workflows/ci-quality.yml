name: CI Quality Gate

on:
  pull_request:
    branches: ["main", "codex/admin-sandbox"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate content
        run: npm run validate:content

      - name: Build app
        run: npm run build

      - name: Run smoke test
        run: npm run qa:smoke -- --skip-build
