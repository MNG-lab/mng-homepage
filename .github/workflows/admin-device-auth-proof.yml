name: Isolated device login verification
on:
  workflow_call:
    inputs:
      public_key:
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'MNG-lab/mng-homepage' && github.ref == 'refs/heads/codex/admin-portal' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install pinned official Codex
        run: npm install --prefix "$RUNNER_TEMP/device-proof-cli" @openai/codex@0.167.1
      - name: Start isolated login and encrypt one-time challenge
        env:
          PROOF_PUBLIC_KEY: ${{ inputs.public_key }}
        run: |
          set -euo pipefail
          umask 077
          nohup node admin/scripts/device-auth-proof.mjs > /dev/null 2>&1 &
          echo "$!" > "$RUNNER_TEMP/device-proof.pid"
          for i in $(seq 1 90); do
            if test -f "$RUNNER_TEMP/device-proof-challenge.enc"; then exit 0; fi
            if test -f "$RUNNER_TEMP/device-proof-result.json"; then cat "$RUNNER_TEMP/device-proof-result.json"; exit 1; fi
            sleep 1
          done
          echo 'Device challenge was not issued within 90 seconds.'
          exit 1
      - name: Deliver encrypted challenge only
        uses: actions/upload-artifact@v7.0.2
        with:
          name: device-login-challenge-${{ github.run_id }}
          path: ${{ runner.temp }}/device-proof-challenge.enc
          retention-days: 1
          if-no-files-found: error
      - name: Wait for browser approval and verify credential structure
        run: |
          set -euo pipefail
          for i in $(seq 1 660); do
            if test -f "$RUNNER_TEMP/device-proof-result.json"; then
              cat "$RUNNER_TEMP/device-proof-result.json"
              node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/device-proof-result.json")); process.exit(r.success && r.cleaned ? 0 : 1)'
              exit 0
            fi
            sleep 1
          done
          echo 'Verification timed out.'
          exit 1
      - name: Remove temporary login files
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/device-proof.pid"; then kill "$(cat "$RUNNER_TEMP/device-proof.pid")" 2>/dev/null || true; fi
          rm -rf "$RUNNER_TEMP/device-proof-home"
          rm -f "$RUNNER_TEMP/device-proof-challenge.enc" "$RUNNER_TEMP/device-proof.pid"
