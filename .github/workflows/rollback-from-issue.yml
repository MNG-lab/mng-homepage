name: Rollback from issue
run-name: 'Rollback request #${{ inputs.issue || github.event.issue.number }}'
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue:
        description: Open rollback request issue number
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: rollback-${{ github.repository }}-${{ inputs.issue || github.event.issue.number }}
  cancel-in-progress: false
jobs:
  rollback:
    if: >-
      github.repository == 'MNG-lab/mng-homepage' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.issue.user.type != 'Bot' &&
        (contains(github.event.issue.labels.*.name, 'rollback-request') || contains(github.event.issue.labels.*.name, 'rollback-simple-request')) &&
        contains(fromJSON('["COLLABORATOR","CONTRIBUTOR","MEMBER","OWNER"]'), github.event.issue.author_association)))
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/create-github-app-token@v3.3.0
        id: app
        with:
          app-id: ${{ secrets.MNG_AI_CODE_BOT_APP_ID }}
          private-key: ${{ secrets.MNG_AI_CODE_BOT_PRIVATE_KEY }}
          owner: MNG-lab
          repositories: mng-homepage
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Create rollback review PR
        id: rollback
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BOT_SLUG: ${{ steps.app.outputs.app-slug }}
          REQUEST_ISSUE: ${{ inputs.issue || github.event.issue.number }}
        run: node admin/scripts/rollback-job.mjs
      - name: Report request result to admin
        if: ${{ always() && contains(fromJSON('["success","failure"]'), steps.rollback.outcome) }}
        env:
          REQUEST_ISSUE: ${{ inputs.issue || github.event.issue.number }}
          REQUEST_RESULT: ${{ steps.rollback.outcome == 'success' && 'success' || 'failed' }}
          REQUEST_FAILURE_CODE: ${{ steps.rollback.outputs.failure_code }}
        run: node admin/scripts/report-rollback-result.mjs
