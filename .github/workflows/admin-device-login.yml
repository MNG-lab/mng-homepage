name: Admin browser Codex connection
on:
  workflow_call:
    inputs:
      session:
        required: true
        type: string
    secrets:
      CODEX_AUTH_JSON_PREVIEW:
        required: false
      CODEX_MODEL:
        required: false
permissions:
  contents: read
  id-token: write
jobs:
  connect:
    if: github.repository == 'MNG-lab/mng-homepage' && github.ref == 'refs/heads/codex/admin-portal' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install official Codex
        run: npm install --prefix "$RUNNER_TEMP/device-cli" @openai/codex@0.167.1
      - name: Connect or verify without printing credentials
        env:
          DEVICE_SESSION: ${{ inputs.session }}
          CODEX_AUTH_JSON_PREVIEW: ${{ secrets.CODEX_AUTH_JSON_PREVIEW }}
          CODEX_MODEL: ${{ secrets.CODEX_MODEL }}
        run: node admin/scripts/device-login-job.mjs
      - name: Delete temporary credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/device-login-home"
