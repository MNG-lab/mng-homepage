name: Deploy Admin Worker

on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER_VERSION: '4.162.0'

jobs:
  deploy:
    if: github.repository == 'MNG-lab/mng-homepage' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: admin-production
      cancel-in-progress: false
    environment:
      name: admin-production
      url: https://admin.mng-lab.workers.dev
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # A queued run or retry should deploy the current main, never an older revision.
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Test admin server
        run: node --test admin/tests/*.test.mjs
      - name: Build production admin
        run: npm run admin:build:production
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test production admin UI
        env:
          ADMIN_TEST_ENV: production
        run: node admin/tests/connected-smoke.mjs
      - name: Validate Worker bundle
        run: npx --yes "wrangler@$WRANGLER_VERSION" deploy --config admin/wrangler.jsonc --dry-run --outdir "$RUNNER_TEMP/admin-worker"
      - name: Apply D1 migrations and deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_DEPLOY_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Set CLOUDFLARE_ADMIN_DEPLOY_TOKEN in the admin-production GitHub environment."
            exit 1
          fi
          npx --offline --yes "wrangler@$WRANGLER_VERSION" d1 migrations apply mng-admin --remote --config admin/wrangler.jsonc
          npx --offline --yes "wrangler@$WRANGLER_VERSION" deploy --config admin/wrangler.jsonc --message "GitHub main $(git rev-parse HEAD)"
