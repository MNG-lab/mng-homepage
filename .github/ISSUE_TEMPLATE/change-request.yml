name: "🛠️ 홈페이지 수정 요청"
description: "페이지와 바꿀 내용을 알려 주세요. 사진이나 참고 자료도 함께 보낼 수 있습니다."
title: "[수정요청] "
labels:
  - codex-auto
body:
  - type: markdown
    attributes:
      value: |
        어디를 어떻게 바꾸고 싶은지 편하게 적어 주세요.
        별도 요청이 없으면 **국문·영문 페이지에 함께 반영**합니다.
        사진과 참고 자료, 추가 정보는 필요한 경우에만 넣으면 됩니다.
        이슈 내용과 첨부 파일은 공개되므로 개인정보·비공개 자료는 넣지 마세요.
  - type: dropdown
    id: page
    attributes:
      label: 어느 페이지인가요?
      options:
        - Home
        - Research
        - Professor
        - Members
        - Publications
        - Gallery
        - Contact
        - 여러 페이지 / 직접 입력
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 어떻게 바꾸면 될까요?
      description: 바꿀 부분과 원하는 결과를 적어 주세요. 현재 상태나 이유가 필요하면 함께 적어 주세요.
      placeholder: "예: Members의 홍길동 연구원 소개를 아래 문구로 바꾸고, 프로필 사진은 첨부한 사진으로 교체해 주세요."
    validations:
      required: true
  - type: textarea
    id: target_urls
    attributes:
      label: 다른 페이지 주소
      description: 여러 페이지 또는 세부 주소를 지정할 때 입력하세요. 주소를 모르면 위 수정 내용에 페이지 이름을 적어 주세요.
      placeholder: "https://dglab.yonsei.ac.kr/members"
    validations:
      required: false
  - type: textarea
    id: references
    attributes:
      label: 사진·참고 자료
      description: 사용할 사진이나 참고 화면을 끌어 넣거나 붙여넣으세요. 이미지·문서·사이트 링크도 함께 넣을 수 있습니다.
      placeholder: "예: 첫 번째 사진은 교체할 프로필 사진이고, 두 번째는 원하는 배치 예시입니다."
    validations:
      required: false
  - type: textarea
    id: exact_text
    attributes:
      label: 정확히 넣을 문구
      description: 그대로 들어가야 하는 문구가 있으면 입력하세요. 수정 내용에 이미 적었다면 반복할 필요는 없습니다.
      placeholder: |
        국문: …
        영문: …
    validations:
      required: false
  - type: textarea
    id: out_of_scope
    attributes:
      label: 변경하지 않을 부분
      placeholder: "예: 다른 페이지의 디자인과 구성원 순서는 유지해 주세요."
    validations:
      required: false
