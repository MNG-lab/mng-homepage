name: "⏪ 특정 변경 취소 (개발자용)"
description: "PR 또는 커밋 1건의 변경을 취소하는 검토용 PR을 만듭니다."
title: "[변경취소] "
labels:
  - rollback-request
body:
  - type: markdown
    attributes:
      value: |
        **지정한 PR 또는 커밋 1건만 취소**합니다. 이후 변경과 겹치면 충돌로 멈출 수 있습니다.
        홈페이지 전체를 과거 상태로 되돌리려면 어드민의 **홈페이지 버전**을 사용하세요.
        어드민에서는 완료된 요청의 **이 변경 취소** 버튼으로 대상을 자동 지정할 수 있습니다.
        결과는 검토용 PR이며, 승인 전에는 홈페이지가 바뀌지 않습니다.
  - type: dropdown
    id: rollback_type
    attributes:
      label: 취소할 대상
      options:
        - PR 번호
        - 커밋 번호
    validations:
      required: true
  - type: input
    id: rollback_target
    attributes:
      label: 대상 번호
      description: main에 반영된 PR 또는 커밋 1개를 지정하세요.
      placeholder: "PR: 85 또는 #85 / 커밋: 7~40자리 SHA"
    validations:
      required: true
  - type: textarea
    id: rollback_reason
    attributes:
      label: 취소하려는 이유
      placeholder: "예: 반영 후 모바일에서 소개 문구가 겹쳐 보여요."
    validations:
      required: true
  - type: textarea
    id: expected_result
    attributes:
      label: 취소 후 확인할 내용
      description: 추가로 확인할 사항이 있으면 적어 주세요.
      placeholder: "예: 변경 전 문구로 돌아오고, 이후 추가한 사진은 유지됩니다."
    validations:
      required: false
