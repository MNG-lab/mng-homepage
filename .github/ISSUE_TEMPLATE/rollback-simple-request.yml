name: "⏪ 직전 변경 취소 (개발자용)"
description: "실행 시작 시 main의 최신 커밋 1건을 취소하는 검토용 PR을 만듭니다."
title: "[변경취소] "
labels:
  - rollback-simple-request
body:
  - type: markdown
    attributes:
      value: |
        **실행이 시작될 때 main의 최신 커밋 1건**을 취소합니다. 작성 중 다른 변경이 반영되면 대상이 달라질 수 있습니다.
        대상이 정해져 있으면 **특정 변경 취소** 양식이나 어드민의 완료된 요청에서 **이 변경 취소**를 사용하세요.
        처음 실행한 대상은 재실행해도 유지됩니다. 결과는 검토용 PR이며, 승인 전에는 홈페이지가 바뀌지 않습니다.
        홈페이지 전체를 과거 상태로 되돌리는 기능은 어드민의 **홈페이지 버전**에서 제공합니다.
  - type: textarea
    id: rollback_reason
    attributes:
      label: 취소하려는 이유
      placeholder: "예: 방금 반영한 변경으로 홈페이지가 표시되지 않습니다."
    validations:
      required: true
  - type: textarea
    id: expected_result
    attributes:
      label: 취소 후 확인할 내용
      description: 추가로 확인할 사항이 있으면 적어 주세요.
      placeholder: "예: Home과 Members 페이지에 정상적으로 접속됩니다."
    validations:
      required: false
