name: "⏪ 직전 변경 되돌리기"
description: "방금 반영한 변경에 문제가 생겼나요? 직전 변경을 되돌릴 PR을 만듭니다."
title: "[변경취소] "
labels:
  - rollback-simple-request
body:
  - type: markdown
    attributes:
      value: |
        **가장 최근에 반영한 홈페이지 변경 1건**을 취소합니다. 어드민·워크플로우만 수정한 변경은 건너뜁니다. 홈페이지와 운영 기능이 함께 바뀐 변경은 자동 취소하지 않고 안내합니다.
        특정 요청을 고르려면 [어드민](https://admin.mng-lab.workers.dev)의 완료된 요청에서 **이 변경 취소**를 사용하세요.
        처음 실행한 대상은 재실행해도 유지됩니다. 결과는 검토용 PR이며, 승인 전에는 홈페이지가 바뀌지 않습니다.
        홈페이지 전체를 과거 상태로 되돌리는 기능은 어드민의 **홈페이지 버전**에서 제공합니다.
  - type: textarea
    id: rollback_reason
    attributes:
      label: 취소하려는 이유
      placeholder: "예: 방금 반영한 변경으로 홈페이지가 표시되지 않습니다."
    validations:
      required: true
  - type: textarea
    id: expected_result
    attributes:
      label: 취소 후 확인할 내용
      description: 추가로 확인할 사항이 있으면 적어 주세요.
      placeholder: "예: Home과 Members 페이지에 정상적으로 접속됩니다."
    validations:
      required: false
